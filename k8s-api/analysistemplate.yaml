apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: demo
spec:
  metrics:
  - name: success-rate
    interval: 10s
    count: 3
    successCondition: result[0] >= 0.95
    failureLimit: 1
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
        query: |
          (
            sum(rate(flask_http_request_total{status=~"2.."}[1m]))
            /
            sum(rate(flask_http_request_total[1m]))
          ) or on() vector(1)
