apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-success-rate
  namespace: demo
spec:
  metrics:
  - name: success-rate
    interval: 15s
    count: 4
    successCondition: result[0] >= 0.95
    failureLimit: 1
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
        query: |
          (
            sum(rate(flask_http_request_total{status=~"2.."}[30s]))
            /
            sum(rate(flask_http_request_total[30s]))
          ) or on() vector(1)
