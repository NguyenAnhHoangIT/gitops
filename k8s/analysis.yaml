apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: demo
spec:
  metrics:
  - name: success-rate
    interval: 5s
    count: 3
    successCondition: result[0] == 1
    failureLimit: 1
    provider:
      prometheus:
        address: http://prometheus-server.prometheus.svc.cluster.local:80
        query: vector(1)
